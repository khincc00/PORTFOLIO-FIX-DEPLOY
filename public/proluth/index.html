<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProLuth — Pembuat LUT .cube</title>
  <meta name="description" content="Buat color grade dan ekspor sebagai LUT 3D .cube untuk Premiere, DaVinci Resolve, Final Cut, OBS, dan lainnya.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 21 7v10l-9 5-9-5V7z' fill='%23f0a63a'/%3E%3C/svg%3E">
  <link rel="canonical" href="https://khincreator.com/proluth">
  <link rel="stylesheet" href="/proluth/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 21 7 12 12 3 7z" fill="#f6c27a"/>
        <path d="M3 7 12 12v10L3 17z" fill="#f0a63a"/>
        <path d="M21 7 12 12v10l9-5z" fill="#b8741d"/>
      </svg>
      <div class="brand-text"><strong>ProLuth</strong><span>Pembuat LUT .cube</span></div>
    </div>
    <div class="actions">
      <a class="btn" href="https://sociabuzz.com/khinccproduction" target="_blank" rel="noopener">Dukung</a>
      <button class="btn icon" id="btnUndo" title="Urungkan (⌘/Ctrl+Z)" aria-label="Urungkan" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="Ulangi (⇧⌘/Ctrl+Shift+Z)" aria-label="Ulangi" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="btnOpenImage">Buka Gambar</button>
      <button class="btn" id="btnImportCube">Impor .cube</button>
      <button class="btn primary" id="btnExportTop">Ekspor .cube</button>
    </div>
    <input type="file" id="fileImage" accept="image/*" hidden>
    <input type="file" id="fileCube" accept=".cube,text/plain" hidden>
    <input type="file" id="fileRef" accept="image/*" hidden>
  </header>

  <main class="layout">
    <section class="workspace">
      <div class="toolbar">
        <div class="segmented" id="compareMode" role="radiogroup" aria-label="Mode perbandingan">
          <button type="button" role="radio" data-mode="after" aria-checked="true" class="active">Sesudah</button>
          <button type="button" role="radio" data-mode="split" aria-checked="false">Split</button>
          <button type="button" role="radio" data-mode="before" aria-checked="false">Sebelum</button>
        </div>
        <div class="base-chip" id="baseChip" hidden>
          <span>LUT dasar: <b id="baseName"></b></span>
          <button type="button" id="btnRemoveBase" aria-label="Lepas LUT dasar" title="Lepas LUT dasar">✕</button>
        </div>
        <span class="hint" id="imageInfo"></span>
      </div>

      <div class="stage" id="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="preview" aria-label="Pratinjau gambar"></canvas>
          <div class="divider" id="divider" hidden><span></span></div>
          <span class="tag tag-left" id="tagBefore" hidden>Sebelum</span>
          <span class="tag tag-right" id="tagAfter" hidden>Sesudah</span>
        </div>
        <div class="drop-overlay" id="dropOverlay">Lepaskan gambar atau file .cube di sini</div>
      </div>

      <div class="presets">
        <h2 class="section-label">Preset</h2>
        <div class="preset-list" id="presetList"></div>
      </div>
    </section>

    <aside class="sidebar">
      <details class="panel" open>
        <summary>Cocokkan Referensi</summary>
        <div class="panel-body">
          <button type="button" class="ref-drop" id="refDrop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
            <strong>Pilih foto referensi</strong>
            <span class="hint">atau seret ke sini — warna &amp; tonal gambar Anda disesuaikan otomatis</span>
          </button>
          <div class="ref-card" id="refCard" hidden>
            <div class="ref-thumb" id="refThumb">
              <img id="refImg" alt="Foto referensi">
              <button type="button" class="ref-remove" id="btnRemoveRef" aria-label="Lepas referensi" title="Lepas referensi">✕</button>
            </div>
            <div class="ref-meta">
              <span id="refName"></span>
              <button type="button" class="link" id="btnChangeRef">Ganti</button>
            </div>
            <div class="ref-sliders" id="refSliders"></div>
            <p class="hint ref-status" id="refStatus"></p>
            <button type="button" class="btn block" id="btnRematch" title="Hitung ulang dari gambar saat ini. Penyesuaian lain direset (bisa diurungkan).">Cocokkan ulang</button>
          </div>
        </div>
      </details>

      <details class="panel" open>
        <summary>Dasar</summary>
        <div class="panel-body">
          <div class="segmented small" id="srcType" role="radiogroup" aria-label="Jenis gambar sumber">
            <button type="button" role="radio" data-type="normal" aria-checked="true" class="active">Normal</button>
            <button type="button" role="radio" data-type="raw" aria-checked="false">Raw / Datar</button>
          </div>
          <p class="hint" id="srcTypeHint"></p>
          <div data-group="basic"></div>
        </div>
      </details>

      <details class="panel" open>
        <summary>Warna</summary>
        <div class="panel-body" data-group="color"></div>
      </details>

      <details class="panel" open>
        <summary>Color Grading</summary>
        <div class="panel-body" data-group="grading"></div>
      </details>

      <details class="panel" open>
        <summary>Kurva</summary>
        <div class="panel-body">
          <div class="segmented small" id="curveChannel" role="radiogroup" aria-label="Kanal kurva">
            <button type="button" role="radio" data-ch="rgb" aria-checked="true" class="active">RGB</button>
            <button type="button" role="radio" data-ch="r" aria-checked="false"><i class="dot r"></i>Merah</button>
            <button type="button" role="radio" data-ch="g" aria-checked="false"><i class="dot g"></i>Hijau</button>
            <button type="button" role="radio" data-ch="b" aria-checked="false"><i class="dot b"></i>Biru</button>
          </div>
          <canvas id="curveCanvas" class="curve-canvas" aria-label="Editor kurva"></canvas>
          <div class="curve-foot">
            <span class="hint">Klik untuk menambah titik · klik dua kali untuk menghapus</span>
            <button type="button" class="link" id="btnResetCurve">Reset</button>
          </div>
        </div>
      </details>

      <details class="panel" open>
        <summary>Ekspor</summary>
        <div class="panel-body">
          <div data-group="output"></div>
          <label class="field">
            <span>Nama LUT</span>
            <input type="text" id="lutName" value="ProLuth_LUT" maxlength="80" spellcheck="false">
          </label>
          <label class="field">
            <span>Ukuran grid</span>
            <select id="lutSize">
              <option value="17">17³ — ringan (kamera, OBS)</option>
              <option value="33" selected>33³ — standar (Premiere, Resolve, FCP)</option>
              <option value="65">65³ — presisi tinggi</option>
            </select>
          </label>
          <p class="hint" id="sizeInfo"></p>
          <button type="button" class="btn primary block" id="btnExport">Download .cube</button>
          <div class="row">
            <button type="button" class="btn block" id="btnExportImage">Simpan gambar (JPG)</button>
            <button type="button" class="btn block" id="btnResetAll">Reset semua</button>
          </div>
        </div>
      </details>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/proluth/js/lut-engine.js"></script>
  <script src="/proluth/js/match.js"></script>
  <script src="/proluth/js/presets.js"></script>
  <script src="/proluth/js/curve-editor.js"></script>
  <script src="/proluth/js/app.js"></script>
</body>
</html>
